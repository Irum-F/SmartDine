services:
  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: [mongo-data:/data/db]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  api:
    build: ./app/api
    environment:
      MONGODB_URI: mongodb://mongo:27017/smartdine
      PORT: 4000
      JWT_SECRET: ${JWT_SECRET}
      REDIS_URL: redis://redis:6379
    ports: ["4000:4000"]
    depends_on: [mongo]

volumes:
  mongo-data: