name: App Build

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/app-build.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        service: [frontend, api, notifier]
    concurrency:
      group: deploy-${{ matrix.service }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Skip services that don't exist yet
        id: check
        run: |
          if [ -f "app/${{ matrix.service }}/Dockerfile" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.check.outputs.exists == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - if: steps.check.outputs.exists == 'true'
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - if: steps.check.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/${{ matrix.service }}/package-lock.json

      - name: Install and test
        if: steps.check.outputs.exists == 'true'
        working-directory: app/${{ matrix.service }}
        run: |
          npm ci
          npm test

      - name: Build image
        if: steps.check.outputs.exists == 'true'
        run: |
          IMAGE="${{ steps.ecr.outputs.registry }}/smartdine-${{ matrix.service }}:${{ github.sha }}"
          docker build -t "$IMAGE" "app/${{ matrix.service }}"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Scan image for vulnerabilities
        if: steps.check.outputs.exists == 'true'
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # Trivy version 0.35.0
        with:
          image-ref: ${{ env.IMAGE }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1" # block the push if fixable critical issues exist

      - name: Push to ECR
        if: steps.check.outputs.exists == 'true'
        env:
          REPO: smartdine-${{ matrix.service }}
          TAG: ${{ github.sha }}
        run: |
          if aws ecr describe-images --repository-name "$REPO" --image-ids imageTag="$TAG" >/dev/null 2>&1; then
            echo "Image $TAG is already in ECR (re-run of the same commit), skipping push"
          else
            docker push "$IMAGE"
          fi

      - name: Record and deploy
        if: steps.check.outputs.exists == 'true'
        env:
          SERVICE: ${{ matrix.service }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          NAME="smartdine-${SERVICE}"
          CLUSTER=$(aws ecs list-clusters --query "clusterArns[?contains(@, 'smartdine')] | [0]" --output text)
          REPO_URI=$(aws ecr describe-repositories --repository-names "$NAME" \
            --query 'repositories[0].repositoryUri' --output text)
          IMAGE="${REPO_URI}:${IMAGE_TAG}"

          # 1. Record the tag, so Terraform always deploys the latest image too
          aws ssm put-parameter --name "/smartdine/${SERVICE}/image-tag" --value "$IMAGE_TAG" --overwrite > /dev/null

          # 2. No service yet: Terraform will create it with this tag
          STATUS=$(aws ecs describe-services --cluster "$CLUSTER" --services "$NAME" \
            --query 'services[0].status' --output text 2>/dev/null || echo NONE)
          if [ "$STATUS" != "ACTIVE" ]; then
            echo "::notice::$NAME doesn't exist yet. Terraform will create it with $IMAGE_TAG."
            exit 0
          fi

          # 3. Service still runs a placeholder (like nginx): only Terraform can change port and health check
          CURRENT_TD=$(aws ecs describe-services --cluster "$CLUSTER" --services "$NAME" \
            --query 'services[0].taskDefinition' --output text)
          CURRENT_IMAGE=$(aws ecs describe-task-definition --task-definition "$CURRENT_TD" \
            --query 'taskDefinition.containerDefinitions[0].image' --output text)
          case "$CURRENT_IMAGE" in
            "$REPO_URI":*) ;;
            *)
              echo "::notice::$NAME runs $CURRENT_IMAGE. Image pushed and tag recorded; run Terraform Apply to switch it over."
              exit 0
              ;;
          esac

          # 4. Roll forward: same task definition, new image
          aws ecs describe-task-definition --task-definition "$CURRENT_TD" --query taskDefinition \
            | jq --arg img "$IMAGE" '.containerDefinitions[0].image = $img
                | del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                      .compatibilities, .registeredAt, .registeredBy)' > td.json
          NEW_TD=$(aws ecs register-task-definition --cli-input-json file://td.json \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          aws ecs update-service --cluster "$CLUSTER" --service "$NAME" --task-definition "$NEW_TD" > /dev/null
          echo "Waiting for $NAME to become stable on $IMAGE_TAG…"
          aws ecs wait services-stable --cluster "$CLUSTER" --services "$NAME"